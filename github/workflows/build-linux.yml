name: Build Linux x86_64 App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux GUI libraries
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk8.6 binutils xdg-utils
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify Tkinter and trust store
        run: python -c "import tkinter, truststore; print('GUI and trust store ready')"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Linux package
        run: bash scripts/build_linux.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveScout-Linux-x86_64
          path: |
            release/ArchiveScout-Linux-x86_64.tar.gz
            release/ArchiveScout-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/ArchiveScout-Linux-x86_64.tar.gz release/ArchiveScout-Linux-x86_64.tar.gz.sha256 --clobber
          else
            gh release create "$TAG" release/ArchiveScout-Linux-x86_64.tar.gz release/ArchiveScout-Linux-x86_64.tar.gz.sha256 --title "Archive Scout $TAG" --generate-notes
          fi
